apiVersion: v1
kind: Secret
metadata:
  name: bravocredit-secrets
type: Opaque
stringData:
  # NOTA: En produccion real, estos valores deben inyectarse desde un
  # sistema de gestion de secretos (AWS Secrets Manager, HashiCorp Vault, etc.)
  # y NUNCA deben commitearse.
  SECRET_KEY_BASE: "sustituir_por_secret_key_base_de_phoenix"
  GUARDIAN_SECRET_KEY: "sustituir_por_guardian_secret_key"
  CLOAK_KEY: "sustituir_por_llave_de_32_bytes_de_cloak"
  POSTGRES_PASSWORD: "sustituir_por_password_seguro"
  DATABASE_URL: "ecto://bravocredit:sustituir_por_password_seguro@bravocredit-postgres:5432/bravo_credit_prod"
