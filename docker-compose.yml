services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "ecto://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/bravo_credit_dev"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      GUARDIAN_SECRET_KEY: "${GUARDIAN_SECRET_KEY:-local-operations-guardian-secret-key-0123456789abcdef}"
      CLOAK_KEY: "${CLOAK_KEY:-0123456789ABCDEF0123456789ABCDEF}"
      PHX_HOST: "${PHX_HOST:-localhost}"
      PORT: "${PORT:-4000}"
      PHX_SERVER: "true"
    ports:
      - "${PORT:-4000}:4000"

volumes:
  postgres_data:
