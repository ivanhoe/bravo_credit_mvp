country_code: PT
country_name: Portugal
currency: EUR

document:
  type: NIF
  validator: nif

rules:
  - id: amount_income_ratio
    kind: max_amount_to_income_ratio
    evaluation_phase: initial
    threshold: "3.5"
    message: O montante solicitado nao pode exceder 3.5x o rendimento mensal

provider:
  adapter: bank_pt
  timeout_ms: 6000

state_transitions:
  pending:
    - provider_processing
    - cancelled
  provider_processing:
    - evaluating
    - cancelled
  evaluating:
    - approved
    - rejected
    - in_review
  in_review:
    - approved
    - rejected
    - cancelled
  approved:
    - cancelled
  rejected: []
  cancelled: []

review:
  min_auto_approval_score: 640
