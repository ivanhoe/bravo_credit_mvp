country_code: BR
country_name: Brazil
currency: BRL

document:
  type: CPF
  validator: cpf

rules:
  - id: debt_income_ratio
    kind: max_total_debt_to_income_ratio
    evaluation_phase: provider
    threshold: "0.45"
    message: A divida total nao pode ultrapassar 45% da renda mensal

provider:
  adapter: bank_br
  timeout_ms: 7000

state_transitions:
  pending:
    - provider_processing
    - cancelled
  provider_processing:
    - evaluating
    - cancelled
  evaluating:
    - approved
    - rejected
    - in_review
  in_review:
    - approved
    - rejected
    - cancelled
  approved:
    - cancelled
  rejected: []
  cancelled: []

review:
  min_auto_approval_score: 650
