country_code: MX
country_name: Mexico
currency: MXN

document:
  type: CURP
  validator: curp

rules:
  - id: amount_income_ratio
    kind: max_amount_to_income_ratio
    evaluation_phase: initial
    threshold: "4.0"
    message: El monto solicitado no puede superar 4x el ingreso mensual

provider:
  adapter: bank_mx
  timeout_ms: 5000

state_transitions:
  pending:
    - provider_processing
    - cancelled
  provider_processing:
    - evaluating
    - cancelled
  evaluating:
    - approved
    - rejected
    - in_review
  in_review:
    - approved
    - rejected
    - cancelled
  approved:
    - cancelled
  rejected: []
  cancelled: []

review:
  high_amount_threshold: "200000"
