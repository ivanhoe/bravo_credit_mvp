country_code: IT
country_name: Italy
currency: EUR

document:
  type: CODICE_FISCALE
  validator: codice_fiscale

rules:
  - id: min_income
    kind: min_income
    evaluation_phase: initial
    amount: "1800.00"
    message: Il reddito mensile minimo deve essere almeno 1,800 EUR

provider:
  adapter: bank_it
  timeout_ms: 6500

state_transitions:
  pending:
    - provider_processing
    - cancelled
  provider_processing:
    - evaluating
    - cancelled
  evaluating:
    - approved
    - rejected
    - in_review
  in_review:
    - approved
    - rejected
    - cancelled
  approved:
    - cancelled
  rejected: []
  cancelled: []

review:
  min_auto_approval_score: 660
